name: auvie
description: "Auvie — editor de fotos e vídeos com estética analógica."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  collection: ^1.19.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  pigeon: ^29.0.7
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/icons/
    - assets/fonts/

  fonts:
    # Variable fonts: weight/optical size are set through FontVariation in
    # lib/app/theme/typography.dart.
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
