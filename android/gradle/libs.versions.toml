# Android dependency versions (checked 2026-10-08).
# Plugin versions live in settings.gradle.kts (pluginManagement can't read the
# catalog). Libraries below are added to app/build.gradle.kts as each
# milestone needs them (Media3 and WorkManager from M2/M6).

[versions]
activity = "1.13.0"
coroutines = "1.11.0"
exifinterface = "1.4.2"
media3 = "1.11.1"
work = "2.12.0"
junit = "4.13.2"
robolectric = "4.17"
truth = "1.4.5"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
orgJson = "20260814"

[libraries]
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-test-utils = { module = "androidx.media3:media3-test-utils", version.ref = "media3" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
# Real org.json for JVM unit tests (android.jar only has stubs).
org-json = { module = "org.json:json", version.ref = "orgJson" }
