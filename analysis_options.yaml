include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - lib/core/native/pigeon/**
    # Pigeon's input DSL, not app code.
    - pigeons/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    public_member_api_docs: false

plugins:
  riverpod_lint: ^3.1.9
