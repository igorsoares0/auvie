tags:
  golden:
    description: >-
      Pixel comparisons of whole screens. Regenerate with
      `flutter test --update-goldens --tags golden` (on the machine whose
      rendering is the reference).
  brand:
    description: >-
      Renders the launcher icon and Play Store art (test/tool). Skipped
      normally; run with `flutter test --run-skipped --tags brand`.
    skip: "Brand art generator, run on demand"
